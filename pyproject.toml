[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formulaic"
version = "0.1.0"
description = "A form and data-structure definition and processing library"
readme = "README.md"
license = { text = "Apache 2.0" }
authors = [
    { name = "Cottage Labs", email = "us@cottagelabs.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://cottagelabs.com/"
Repository = "https://github.com/CottageLabs/formulaic"

[tool.setuptools.packages.find]
where = ["."]
include = ["formulaic*"]

[tool.pytest.ini_options]
testpaths = ["formulaic/test"]


