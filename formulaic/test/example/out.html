<form id="public_application_form_context_form" action="/application" method="POST">
<fieldset id="basic_compliance_fieldset">
<div>
<div>
<label for="boai_y">Yes</label>
<input name="boai" type="radio" id="boai_y" value="y" />
<label for="boai_n">No</label>
<input name="boai" type="radio" id="boai_n" value="n" />
<label for="boai_u">Unknown</label>
<input name="boai" type="radio" id="boai_u" value="u" />
</div>
</div>
<div>
<div>
<label for="oa_statement_url_input">The journal website must display its open access statement. Where can we find this information?</label>
<input type="text" name="oa_statement_url" placeholder="https://www.my-journal.com/open-access" id="oa_statement_url_input" />
</div>
</div>
</fieldset>
<fieldset id="apc_fieldset">
<div>
<div>
<label for="apc_y">Yes</label>
<input name="apc" type="radio" id="apc_y" value="y" />
<label for="apc_n">No</label>
<input name="apc" type="radio" id="apc_n" value="n" />
</div>
</div>
<div>
<div>
<label for="apc_currency_select">What is the currency of the APC?</label>
<select class="input-xlarge" name="apc_currency" id="apc_currency_select">
<option value="">Currency</option>
<option value="USD">US Dollar</option>
<option value="EUR">Euro</option>
<option value="GBP">British Pound</option>
<option value="JPY">Japanese Yen</option>
</select>
</div>
</div>
<div>
<div>
<label for="apc_max_input">What is the maximum APC charged by this journal?</label>
<input min="1" name="apc_max" type="number" id="apc_max_input" />
</div>
</div>
</fieldset>
</form>
